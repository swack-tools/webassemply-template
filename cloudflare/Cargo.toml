[package]
name = "cf-worker-kv-template"
version = "0.1.0"
edition = "2021"
authors = ["swackhamer <swackhamer@users.noreply.github.com>"]
description = "100% pure-Rust Cloudflare Worker template using Cloudflare Workers KV as consolidated state storage"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Cloudflare Worker SDK
worker = "0.8.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography & Hashing
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
base64 = "0.22"
hex = "0.4"

# Entropy for wasm32-unknown-unknown
getrandom = { version = "0.2", features = ["js"] }

# Error and Async Traits
thiserror = "1.0"
async-trait = "0.1"

# URL & Encoding
url = "2.5"
percent-encoding = "2.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

