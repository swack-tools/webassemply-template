site_name: Cloudflare Workers and KV Rust template
site_description: Pure-Rust Cloudflare Workers template using Cloudflare Workers KV as consolidated state storage.
# The Documentation workflow sets SITE_URL from the Pages configuration. Local builds leave it unset.
site_url: !ENV [SITE_URL, null]
repo_url: https://github.com/swack-tools/webassemply-template
repo_name: swack-tools/webassemply-template
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  requirements.txt
site_dir: site
strict: true

validation:
  nav:
    omitted_files: warn
    absolute_links: warn
    not_found: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

theme:
  name: material
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - KV state architecture: kv-state-architecture.md
  - Cloudflare edge and wasmCloud: wasmcloud-and-cloudflare-edge.md
  - AI harnesses and model routing: ai-harnesses-and-routing.md
  - Style guide and GitHub Pages: style-guide-and-github-pages.md
  - Customize GitHub runners and Cloudflare: customizing-github-runners-and-cloudflare.md
